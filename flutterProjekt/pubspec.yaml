name: ai_study_app
description: "AI-powered study application for students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # DI
  get_it: ^8.0.3

  # Network
  dio: ^5.6.0

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF
  syncfusion_flutter_pdf: ^27.2.5

  # Files and images
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Security
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.2.7

  # Serialization
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # UUID
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
